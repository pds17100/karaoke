spring:
  datasource:
    url: jdbc:mysql://localhost:3306/karaoke_test?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    timeout: 300
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: dummy
            client-secret: dummy
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

external:
  api:
    karaoke:
      base-url: http://localhost
      service-key: dummy
    kakao:
      api-key: dummy

file:
  upload-dir: /tmp/karaoke-test