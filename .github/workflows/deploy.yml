name: CI - Build & Push

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 빌드
        run: |
         chmod +x ./gradlew
         ./gradlew build

      - name: Docker Hub 로그인
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 이미지 빌드 & 푸시
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/karaoke-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/karaoke-backend:latest